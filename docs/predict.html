<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stock-watch</title>
<style>
  :root { color-scheme:light; --plane:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.1); --blue:#2a78d6; --green:#0ca30c; --red:#d03b3b; }
  @media (prefers-color-scheme:dark) { :root { color-scheme:dark; --plane:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.1); --blue:#3987e5; --green:#35c535; } }
  * { box-sizing:border-box; } body { margin:0; background:var(--plane); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }.hero { min-height:49svh; background:#fff; color:#000; display:grid; place-items:center; text-align:center; padding:2rem; }.hero h1 { margin:0; font-size:clamp(3rem,14vw,14rem); letter-spacing:-.06em; line-height:.85; }.hero p { margin:1.3rem 0 0; text-transform:uppercase; letter-spacing:.18em; font-size:clamp(.72rem,1.6vw,1rem); opacity:.55; }.board { max-width:1080px; margin:auto; padding:4rem 1.25rem 5rem; }.board h2 { margin:0; font-size:1.35rem; }.stamp { margin:.25rem 0 2rem; color:var(--ink2); font-size:.92rem; }.note { border-left:3px solid var(--blue); background:var(--surface); color:var(--ink2); padding:.75rem .95rem; border-radius:0 7px 7px 0; font-size:.88rem; }.grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1.25rem; margin-top:1.25rem; }.wide { grid-column:1/-1; } @media(max-width:700px) { .grid { grid-template-columns:1fr; }.wide { grid-column:auto; } }.card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1.1rem 1.2rem; }.card h3 { margin:0; font-size:1rem; }.head { display:flex; align-items:start; justify-content:space-between; gap:1rem; }.figure { font-size:2.15rem; line-height:1.05; font-weight:750; letter-spacing:-.035em; text-align:right; font-variant-numeric:tabular-nums; }.gain { color:var(--green); }.loss { color:var(--red); }.sub { color:var(--ink2); font-size:.8rem; text-align:right; }.metrics { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; margin-top:1rem; padding-top:.9rem; border-top:1px solid var(--grid); }.metric b { display:block; font-variant-numeric:tabular-nums; }.metric span { display:block; color:var(--muted); font-size:.74rem; }.legend { display:flex; gap:1rem; flex-wrap:wrap; margin:.8rem 0 -.35rem; color:var(--ink2); font-size:.78rem; }.key { width:1rem; height:.18rem; display:inline-block; background:var(--blue); margin-right:.25rem; vertical-align:middle; }.key.real { background:var(--ink); }.key.band { height:.6rem; opacity:.2; }.empty { color:var(--muted); text-align:center; padding:2rem 0; } svg { display:block; width:100%; margin-top:.8rem; }
</style>
</head>
<body>
<section class="hero"><div><h1>stock-watch</h1><p>S&P 500 · täglicher Prognosemonitor</p></div></section>
<main class="board"><h2>Prognose und Realität</h2><p class="stamp" id="stamp">Öffentliche Ergebnisdaten werden geladen …</p><p class="note">Dieses Dashboard zeigt ausschließlich veröffentlichte Ergebnisse: Prognose, tatsächlichen Verlauf und eine kurze Tagesnotiz. Modell, Rohdaten und Forschung bleiben privat.</p><div class="grid" id="content"></div></main>
<script>
const $=id=>document.getElementById(id), num=(n,d=2)=>Number(n).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d}), pct=n=>`${Number(n)>=0?"+":""}${num(n)} %`;
function chart(pred, real) { if(!pred?.length)return ""; const values=[...pred.flatMap(p=>[p.lower_pct,p.upper_pct,p.return_pct]),...(real||[]).map(p=>p.return_pct).filter(Number.isFinite)], max=Math.max(1,...values.map(Math.abs))*1.15, W=700,H=260,L=46,R=16,T=18,B=28,iw=W-L-R,ih=H-T-B,x=i=>L+(pred.length<2?iw/2:i/(pred.length-1)*iw),y=v=>T+ih-(v+max)/(2*max)*ih,path=(a,k)=>a.map((p,i)=>`${i?"L":"M"}${x(i)},${y(p[k])}`).join(" "); const top=path(pred,"upper_pct"), bottom=pred.slice().reverse().map((p,j)=>`L${x(pred.length-1-j)},${y(p.lower_pct)}`).join(" "), actual=(real||[]).filter(p=>p.return_pct!=null).map((p,i)=>`${i?"L":"M"}${x(i)},${y(p.return_pct)}`).join(" "); return `<svg viewBox="0 0 ${W} ${H}"><line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/><path d="${top}${bottom}Z" fill="var(--blue)" opacity=".16"/><path d="${path(pred,"return_pct")}" fill="none" stroke="var(--blue)" stroke-width="2.4"/><path d="${actual}" fill="none" stroke="var(--ink)" stroke-width="2.2"/>${pred.map((p,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${p.time}</text>`).join("")}</svg>`; }
function render(data) { const p=data.prediction,e=data.latest_evaluation,m=data.metrics; $("stamp").textContent=data.updated_at?`Aktualisiert ${new Date(data.updated_at).toLocaleString("de-DE")}`:"Noch keine veröffentlichte Tagesprognose."; if(!p){$("content").innerHTML=`<section class="card wide empty">${data.note||"Noch keine Daten."}</section>`;return;} const r=p.close_return_pct, cls=r>=0?"gain":"loss"; $("content").innerHTML=`<section class="card"><div class="head"><div><h3>Aktuelle Prognose</h3><div class="sub" style="text-align:left">${p.session||"–"} · S&P 500</div></div><div><div class="figure ${cls}">${pct(r)}</div><div class="sub">erwartete Tagesrendite</div></div></div><div class="metrics"><div class="metric"><b>${num(p.expected_close)} USD</b><span>erwarteter Schluss</span></div><div class="metric"><b>± ${num(p.uncertainty_pct)} %</b><span>historischer Fehlerkorridor</span></div></div></section><section class="card"><h3>Öffentliche Tagesnotiz</h3><p>${data.note||"–"}</p><div class="metrics"><div class="metric"><b>${m?.days??0}</b><span>bewertete Tage</span></div><div class="metric"><b>${m?.model_mae_pct!=null?num(m.model_mae_pct,3)+" %":"–"}</b><span>Modellfehler</span></div><div class="metric"><b>${m?.zero_baseline_mae_pct!=null?num(m.zero_baseline_mae_pct,3)+" %":"–"}</b><span>Nullprognose</span></div><div class="metric"><b>${m?.direction_accuracy_pct!=null?num(m.direction_accuracy_pct,1)+" %":"–"}</b><span>Richtung richtig</span></div></div></section><section class="card wide"><h3>Letzter Tagesverlauf</h3><div class="legend"><span><i class="key"></i>Prognose</span><span><i class="key band"></i>Fehlerkorridor</span>${e?'<span><i class="key real"></i>tatsächlich</span>':""}</div>${chart((e||p).path,e?.actual_path)}</section>`; }
(async()=>{try{const r=await fetch("data/predict-public.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();render(await r.json());}catch{$("stamp").textContent="Die Ergebnisdaten sind momentan nicht verfügbar.";}})();
</script>
</body></html>
