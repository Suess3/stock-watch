name: ETF Watcher

on:
  schedule:
    # alle 10 Minuten (GitHub fuehrt Cron-Jobs oft mit einigen Minuten Verzoegerung aus)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # erlaubt manuelles Starten ueber den Actions-Tab

permissions:
  contents: write         # noetig, um state.json zurueckzuschreiben

concurrency:
  group: etf-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Kurse pruefen
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python tracker.py --once

      - name: Alarm-Status sichern
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: Alarm-Status aktualisiert [skip ci]"
            git push
          else
            echo "Keine Statusaenderung."
          fi
